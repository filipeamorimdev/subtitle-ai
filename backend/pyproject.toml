[project]
name = "subtitle-ai"
version = "0.3.0a2"
description = "AI subtitle translation fallback for Bazarr"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.17",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "faster-whisper>=1.1.0",
    "chatterbox-tts==0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
separation = [
    "demucs>=4.0.1",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "media_integration: optional end-to-end tests against real ffmpeg/media (not run by default CI extras)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep CI on real defects. The repo was never formatted under Ruff's full rule set.
select = ["E4", "E7", "E9", "F"]
