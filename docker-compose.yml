services:
  subtitle-ai:
    build: .
    container_name: subtitle-ai
    restart: unless-stopped
    ports:
      - "6768:6768"
    volumes:
      - ./config:/config
      - /path/to/media:/media
    environment:
      - TZ=Europe/Lisbon
      - SUBTITLE_AI_CONFIG_DIR=/config
      - SUBTITLE_AI_LOG_LEVEL=INFO
      # Optional HTTP Basic auth:
      # - SUBTITLE_AI_AUTH_PASSWORD=change-me
      # Optional; omit to auto-discover mounts under /data and /media:
      # - SUBTITLE_AI_MEDIA_ROOTS=/media
      # Optional per-task audio-separation traces under /config/debug:
      # - SUBTITLE_AI_DEBUG_TRACE=true
      # CPU-only dubbing safety controls:
      # - SUBTITLE_AI_DUB_MAX_RUNTIME_HOURS=12
      # - SUBTITLE_AI_CHATTERBOX_RECYCLE_CUES=50
      # - SUBTITLE_AI_CHATTERBOX_MAX_CUE_SECONDS=600
